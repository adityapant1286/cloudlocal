<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudlocal</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link type="text/css" rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-slate-200 font-sans">
<div class="flex h-screen">
  <aside class="w-64 bg-gray-900 border-r border-gray-800 p-6 flex flex-col">
    <div class="mb-10">
      <h1 class="text-2xl font-black text-orange-500 tracking-tighter">CLOUD<span class="text-white">LOCAL</span></h1>
<!--      <p class="text-xs text-gray-500 font-mono mt-1">Edge Dispatcher v1.0</p>-->
    </div>

    <nav class="flex-1">
      <h2 class="text-xs uppercase tracking-widest text-gray-500 font-bold mb-4">Service Status</h2>
      <div id="service-list" class="space-y-4">
      </div>
    </nav>

    <div class="mt-auto pt-6 border-t border-gray-800">
      <div class="text-xs text-gray-500 italic">Volume Path:</div>
      <div id="vol-path" class="text-[10px] font-mono text-orange-400 break-all">/opt/cloudlocal</div>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto p-10">
    <div class="flex justify-between items-start mb-10">
      <div>
        <h2 class="text-4xl font-bold text-white tracking-tight">System Overview</h2>
        <p class="text-gray-400 mt-2">Real-time health and storage monitoring for your AWS mocks.</p>
      </div>
      <div id="global-status" class="px-4 py-2 rounded-full bg-gray-800 border border-gray-700 text-xs font-bold uppercase tracking-widest text-green-400 flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
        System Healthy
      </div>
    </div>

    <h3 class="text-sm font-bold uppercase text-gray-500 mb-4 tracking-widest">Storage Usage</h3>
    <div id="storage-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
    </div>

    <section class="mt-10">
      <h3 class="text-sm font-bold uppercase text-gray-500 mb-4 tracking-widest">Management Actions</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl">
          <h4 class="text-green-400 font-bold mb-4 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            S3 Buckets
          </h4>
          <div id="s3-actions" class="space-y-2">
          </div>
        </div>

        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl">
          <h4 class="text-blue-400 font-bold mb-4 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            SQS Queues
          </h4>
          <div id="sqs-actions" class="space-y-2">
          </div>
        </div>
      </div>
    </section>

    <div class="bg-blue-900/20 border border-blue-500/30 p-6 rounded-2xl">
      <h3 class="text-blue-400 font-bold mb-2">Developer Note</h3>
      <p class="text-sm text-blue-200/70">All enabled services are available at <code>http://localhost:10050</code></p>
    </div>
  </main>
</div>

<script>
  async function triggerAction(action, service, target) {
    if (!confirm(`Are you sure you want to ${action.replace('_',' ')} for ${target}?`)) return;

    await fetch('/dashboard/api/action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ action, service, target })
    });
    await fetchData(); // Refresh UI
  }

  async function fetchData() {
    try {
      const res = await fetch('/dashboard/api/status');
      const data = await res.json();

      // 1. Update Sidebar Status
      const serviceList = document.getElementById('service-list');
      serviceList.innerHTML = data.services.map(s => `
                    <div class="flex items-center justify-between group">
                        <span class="text-sm font-medium ${s.healthy ? 'text-slate-200' : 'text-gray-600'}">${s.name}</span>
                        <div class="flex items-center gap-2">
<!--                            <span class="text-[10px] text-gray-600 font-mono">:${s.port}</span>-->
                            <div class="w-2 h-2 rounded-full ${s.healthy ? 'bg-green-500 shadow-[0_0_8px_#22c55e]' : 'bg-red-500 status-pulse'}"></div>
                        </div>
                    </div>
                `).join('');

      // 2. Update Storage Grid
      const storageGrid = document.getElementById('storage-grid');
      storageGrid.innerHTML = Object.entries(data.storage).map(([svc, size]) => `
                    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl hover:border-gray-700 transition-colors">
                        <div class="text-xs font-bold text-gray-500 uppercase tracking-tighter">${svc}</div>
                        <div class="text-3xl font-black text-white mt-2">${size}</div>
                    </div>
                `).join('');

      document.getElementById('vol-path').innerText = data.volume_path;

      const s3Container = document.getElementById('s3-actions');
      s3Container.innerHTML = data.buckets.map(b => `
        <div class="flex items-center justify-between p-2 hover:bg-gray-800 rounded-lg transition-colors">
            <span class="text-sm font-mono">${b}</span>
            <button onclick="triggerAction('clear_s3', 's3', '${b}')" class="text-xs bg-red-900/40 text-red-400 px-3 py-1 rounded-md border border-red-500/30 hover:bg-red-500 hover:text-white transition-all">Clear</button>
        </div>
      `).join('');
    } catch (err) {
      console.error("Dashboard sync error:", err);
    }
  }

  // Poll every 3 seconds
  // setInterval(fetchData, 3000);
  fetchData();
</script>
</body>
</html>
